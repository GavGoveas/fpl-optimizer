name: Friday FPL recommendation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: fpl-deadline-scheduler-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore deadline state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .fplcopilot/scheduler.sqlite*
          key: fpl-scheduler-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: fpl-scheduler-${{ github.repository_id }}-
      - name: Probe authoritative deadline
        id: probe
        if: github.event_name == 'schedule'
        run: python -m src.notifications.deadline_scheduler
        env:
          FPL_API_URL: ${{ vars.FPL_API_URL }}
          FPL_SCHEDULE_STATE_PATH: .fplcopilot/scheduler.sqlite
      - name: Install recommendation dependencies
        if: github.event_name == 'workflow_dispatch' || steps.probe.outputs.due == 'true'
        run: python -m pip install -r requirements.txt
      - name: Build and deliver recommendation
        if: github.event_name == 'workflow_dispatch' || steps.probe.outputs.due == 'true'
        run: python -m src.run_recommendation
        env:
          FPL_MANAGER_ID: ${{ secrets.FPL_MANAGER_ID }}
          FPL_API_URL: ${{ vars.FPL_API_URL }}
          FPL_SCHEDULE_STATE_PATH: .fplcopilot/scheduler.sqlite
          FPL_SCHEDULE_GAMEWEEK: ${{ steps.probe.outputs.gameweek }}
          FPL_SCHEDULE_DEADLINE: ${{ steps.probe.outputs.deadline }}
          FPL_SCHEDULE_DEADLINE_KEY: ${{ steps.probe.outputs.deadline_key }}
          FPL_SCHEDULE_STAGE_OFFSET_MINUTES: ${{ steps.probe.outputs.stage_offset_minutes }}
          FPL_SCHEDULE_NOTIFY: ${{ steps.probe.outputs.notify }}
          FPL_SCHEDULED: ${{ github.event_name == 'schedule' }}
          RSS_URLS: ${{ vars.RSS_URLS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOCCERDATA_API_KEY: ${{ secrets.SOCCERDATA_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist deadline state
        if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .fplcopilot/scheduler.sqlite*
          key: fpl-scheduler-${{ github.repository_id }}-${{ github.run_id }}